<!-- @dsCard group="Forms" height=380 subtitle="Static rendition" -->
<section style="max-width:360px;padding:24px;background:var(--bg)">
  <p class="label-mono" style="color:var(--gold);margin:0 0 10px">AMA Solutions updates</p>
  <p class="body-mono" style="color:var(--text-secondary);font-size:13px;margin:0 0 14px">Occasional company news and relevant service offers. Sign up only if you want these emails.</p>
  <form style="display:flex;flex-direction:column;gap:12px" onsubmit="return false">
    <label for="nl-email" class="label-mono" style="color:var(--text-dim)">Email address</label>
    <input id="nl-email" type="email" placeholder="you@example.com" style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font-mono)">
    <label style="display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--text-secondary);line-height:1.5"><input type="checkbox" style="margin-top:3px">I agree to receive occasional AMA Solutions news and offers. I can unsubscribe at any time.</label>
    <button type="submit" class="btn-secondary" style="align-self:flex-start">Subscribe</button>
  </form>
</section>
