<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:24px;background:var(--bg)">
  <div class="card card-gold">
    <div style="width:40px;height:40px;border-radius:12px;background:var(--gold-glow);color:var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:16px" class="label-mono">01</div>
    <h3 class="display-sm" style="color:var(--text);margin:0 0 12px;font-size:22px">Scoped, reviewable work</h3>

  </div>
  <div class="card">
